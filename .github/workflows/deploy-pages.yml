name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  # Commits made by the pipeline workflows use GITHUB_TOKEN, which by
  # design does NOT trigger `push` workflows -- so redeploy Pages when a
  # pipeline run finishes (that's when data/view JSON changes land).
  workflow_run:
    workflows: [daily-snapshot, backfill]
    types: [completed]
  workflow_dispatch:

# Publishes the built site to a `gh-pages` branch, which GitHub Pages
# serves via "Deploy from a branch". This avoids the github-pages
# deployment-environment gate that the Actions-artifact method requires.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      # .nojekyll so GitHub serves the built SPA verbatim (no Jekyll
      # processing of the Vite output).
      - run: touch web/dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd web/dist
          git init -q
          git config user.name "sealdeon-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
