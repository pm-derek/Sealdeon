name: daily-snapshot

on:
  schedule:
    # TCGCSV refreshes ~daily around 20:00 UTC; run after that.
    #
    # Deliberately NOT on the hour or half hour. GitHub queues scheduled
    # workflows behind every other repo's, and the :00/:30 slots are the
    # busiest -- this job was routinely starting 1.5-8h late from "30 21",
    # which is what pushed runs past UTC midnight. An odd minute measurably
    # shortens that queue wait. Correctness no longer depends on it
    # (fetch_current dates rows by the run's intended day, not its wall
    # clock), so a late run is now merely late, not a lost day.
    - cron: "7 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "snapshot = normal daily run; repair-only = fill gaps, leave today alone"
        type: choice
        options: [snapshot, repair-only]
        default: snapshot
      snapshot_date:
        description: "Snapshot date override (YYYY-MM-DD). Blank = auto."
        required: false
      repair_lookback:
        description: "Gap-repair window in days (default 45)."
        required: false
      repair_max_dates:
        description: "Max dates to repair in this run (default 5)."
        required: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch snapshot, repair gaps, rebuild views
        id: snapshot
        env:
          SEALDEON_REPAIR_LOOKBACK: ${{ inputs.repair_lookback }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode || 'snapshot' }}" = "repair-only" ]; then
            # Fill holes without touching the current day's rows -- used to
            # recover days lost before the dating fix landed.
            python pipeline/backfill_archive.py --repair-gaps \
              --lookback "${{ inputs.repair_lookback || '90' }}" \
              --max-dates "${{ inputs.repair_max_dates || '10' }}"
          elif [ -n "${{ inputs.snapshot_date }}" ]; then
            python pipeline/fetch_current.py --date "${{ inputs.snapshot_date }}"
          else
            python pipeline/fetch_current.py
          fi

      - name: Report lake coverage
        if: always()
        run: python pipeline/check_coverage.py --lookback 45 >> "$GITHUB_STEP_SUMMARY"

      - name: Commit lake + views
        run: |
          git config user.name "sealdeon-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data web/public/views
          git diff --cached --quiet && echo "no changes" && exit 0
          MSG="daily snapshot ${{ steps.snapshot.outputs.snapshot_date || '(date unknown)' }}"
          if [ "${{ inputs.mode || 'snapshot' }}" = "repair-only" ]; then
            MSG="backfill: repair missing snapshot dates"
          fi
          git commit -m "$MSG"
          # The repo may have moved on (another workflow, a manual push) during
          # the ~7min run; rebase onto it rather than failing the whole day.
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push failed, rebasing and retrying ($i)"
            git pull --rebase origin main || true
            sleep $((2 ** i))
          done
          echo "::error::push failed after 4 attempts" && exit 1
